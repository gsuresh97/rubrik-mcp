site_name: Rubrik MCP Plugin
site_description: Connect your AI assistant to Rubrik Security Cloud
site_url: https://rubrikinc.github.io/rubrik-mcp/
repo_url: https://github.com/rubrikinc/rubrik-mcp
repo_name: rubrikinc/rubrik-mcp
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/rubrik.css

nav:
  - Overview: index.md
  - Getting Started:
    - Quick Start: getting-started.md
    - Authentication: authentication.md
    - Platform Setup: platforms.md
  - What Can It Do: what-can-it-do.md
  - Write Operations: write-operations.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
