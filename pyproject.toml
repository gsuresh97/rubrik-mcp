[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rubrik-mcp"
dynamic = ["version"]
description = "MCP server for Rubrik Security Cloud"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9",
    "rsc-client>=1.5.20260601",
]

[tool.hatch.version]
path = "src/rubrik/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rubrik"]

[project.scripts]
rubrik-mcp = "rubrik.server:main"
rubrik-job-monitor = "rubrik.server:job_monitor_main"
